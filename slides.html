<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Lecture Slides — Data Mining (Reveal.js)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/night.css" id="reveal-theme">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <style>
    :root {
      --sl-bg: #0b1120;
      --sl-bar: rgba(11, 17, 32, 0.96);
      --sl-panel: #162033;
      --sl-card: #0f172a;
      --sl-border: #2c3e5e;
      --sl-text: #f1f5f9;
      --sl-muted: #94a3b8;
      --sl-accent: #f59e0b;
      --sl-accent-text: #0b1120;
      --sl-formula-bg: #080d18;
      --sl-formula-text: #fde68a;
      --sl-note-bg: rgba(59, 130, 246, 0.14);
      --sl-note-text: #cbd5e1;
      --sl-table-th: #162033;
      --sl-ok: #10b981;
      --sl-ok-bg: rgba(16, 185, 129, 0.18);
      --sl-bad: #ef4444;
      --sl-bad-bg: rgba(239, 68, 68, 0.18);
      --sw-panel: #0f172a;
      --sw-sub: #162033;
      --sw-text: #e2e8f0;
      --sw-border: #334155;
      --sw-btn: #1e293b;
    }

    [data-theme="light"] {
      --sl-bg: #ffffff;
      --sl-bar: rgba(248, 250, 252, 0.96);
      --sl-panel: #ffffff;
      --sl-card: #f8fafc;
      --sl-border: #cbd5e1;
      --sl-text: #0f172a;
      --sl-muted: #475569;
      --sl-accent: #d97706;
      --sl-accent-text: #ffffff;
      --sl-formula-bg: #fffbeb;
      --sl-formula-text: #92400e;
      --sl-note-bg: rgba(37, 99, 235, 0.08);
      --sl-note-text: #1e293b;
      --sl-table-th: #f1f5f9;
      --sl-ok: #059669;
      --sl-ok-bg: rgba(16, 185, 129, 0.14);
      --sl-bad: #dc2626;
      --sl-bad-bg: rgba(239, 68, 68, 0.12);
      --sw-panel: #ffffff;
      --sw-sub: #f1f5f9;
      --sw-text: #0f172a;
      --sw-border: #cbd5e1;
      --sw-btn: #e2e8f0;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--sl-bg);
      color: var(--sl-text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* Bypass fragments completely when animation is OFF */
    body.no-fragments .reveal .slides section .fragment {
      opacity: 1 !important;
      visibility: visible !important;
      transform: none !important;
      transition: none !important;
    }

    .slides-topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 140;
      min-height: 56px;
      background: var(--sl-bar);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--sl-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 0.9rem;
      gap: 0.5rem;
      color: var(--sl-text);
      font-size: 0.85rem;
      flex-wrap: wrap;
    }

    .topbar-left, .topbar-drawer {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    .hamburger-btn {
      display: none;
      min-width: 44px;
      min-height: 40px;
      font-size: 1.1rem;
      padding: 0.3rem 0.7rem;
      align-items: center;
      justify-content: center;
    }

    .slide-float-nav {
      position: fixed;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 130;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      pointer-events: none;
    }

    .float-nav-btn {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.72);
      color: #f8fafc;
      border: 1px solid rgba(245, 158, 11, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 0.55rem 1.05rem;
      min-height: 44px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.32);
      transition: transform 0.12s, background 0.15s;
    }
    [data-theme="light"] .float-nav-btn {
      background: rgba(255, 255, 255, 0.85);
      color: #0f172a;
      border-color: rgba(217, 119, 6, 0.55);
    }
    .float-nav-btn:active { transform: scale(0.96); }

    .topbar-btn {
      background: var(--sl-panel);
      color: var(--sl-text);
      border: 1px solid var(--sl-border);
      border-radius: 8px;
      padding: 0.38rem 0.72rem;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s, background 0.15s;
    }

    .topbar-btn:hover { border-color: var(--sl-accent); color: var(--sl-accent); }
    .topbar-btn.active { background: var(--sl-accent); color: var(--sl-accent-text); border-color: var(--sl-accent); }
    .topbar-btn.off-state { opacity: 0.82; border-style: dashed; }

    .topic-select {
      background: var(--sl-panel);
      color: var(--sl-text);
      border: 1px solid var(--sl-border);
      border-radius: 8px;
      padding: 0.38rem 0.65rem;
      font-size: 0.82rem;
      max-width: 260px;
    }

    .slide-jump-select {
      max-width: 220px;
    }

    .reveal-wrapper {
      position: fixed;
      top: 58px; left: 0; right: 0; bottom: 0;
      height: calc(100dvh - 58px);
      background: var(--sl-bg);
      touch-action: pan-x pan-y;
    }

    /* +30% larger typography across desktop & wide 1400x850 canvas */
    .reveal {
      font-size: 34px;
      color: var(--sl-text);
    }
    .reveal .slides {
      text-align: center;
    }
    .reveal h1, .reveal h2, .reveal h3 {
      text-transform: none;
      color: var(--sl-accent);
      font-weight: 800;
      letter-spacing: -0.015em;
    }
    .reveal h1 { font-size: 1.72em; line-height: 1.15; }
    .reveal h2 { font-size: 1.32em; margin-bottom: 0.45em; line-height: 1.2; }
    .reveal p, .reveal li { color: var(--sl-text); }
    .reveal ul {
      display: block;
      text-align: left;
      margin: 0.45em auto;
      max-width: 1180px;
    }
    .reveal li {
      margin-bottom: 0.42em;
      line-height: 1.42;
      font-size: 0.92em;
    }
    .reveal a { color: var(--sl-accent); }
    .reveal .slide-number {
      background: var(--sl-panel);
      color: var(--sl-text);
      border: 1px solid var(--sl-border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 16px;
    }
    .reveal .controls { color: var(--sl-accent); }

    .slide-subtitle { color: var(--sl-muted); font-size: 0.82em; margin-bottom: 0.7em; }
    .slide-formula {
      background: var(--sl-formula-bg);
      border: 1px solid var(--sl-accent);
      border-radius: 12px;
      padding: 0.6em 1em;
      color: var(--sl-formula-text);
      font-size: 0.95em;
      margin: 0.55em auto;
      max-width: 1180px;
      overflow-x: auto;
    }
    .slide-note {
      background: var(--sl-note-bg);
      border-left: 5px solid #3b82f6;
      padding: 0.6em 0.95em;
      border-radius: 0 10px 10px 0;
      font-size: 0.78em;
      color: var(--sl-note-text);
      text-align: left;
      max-width: 1180px;
      margin: 0.6em auto 0;
    }
    .slide-discussion {
      background: var(--sl-card);
      border: 2px solid var(--sl-accent);
      border-radius: 14px;
      padding: 0.85em 1.1em;
      text-align: left;
      max-width: 1140px;
      margin: 0.55em auto;
      font-size: 0.86em;
      color: var(--sl-text);
    }
    .reveal-ans-btn {
      margin-top: 0.65em;
      background: var(--sl-accent);
      color: var(--sl-accent-text);
      border: none;
      border-radius: 9px;
      padding: 0.48em 1.05em;
      font-weight: 700;
      font-size: 0.88em;
      cursor: pointer;
    }
    .slide-ans-box {
      display: none;
      margin-top: 0.65em;
      background: var(--sl-ok-bg);
      border-left: 5px solid var(--sl-ok);
      padding: 0.55em 0.85em;
      border-radius: 0 10px 10px 0;
      color: var(--sl-text);
    }
    .slide-ans-box.open { display: block; }

    /* Interactive Slide Exercises (+30% larger & theme-aware) */
    .slide-widget-slot, .slide-exercise-slot {
      max-width: 1120px;
      margin: 0.5em auto;
    }
    .slide-ex-card {
      background: var(--sl-card);
      border: 1.5px solid var(--sl-border);
      border-radius: 14px;
      padding: 20px 24px;
      text-align: left;
      color: var(--sl-text);
      font-size: 22px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
    }
    .slide-ex-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .slide-ex-title {
      font-weight: 800;
      margin-bottom: 14px;
      color: var(--sl-accent);
      font-size: 24px;
      line-height: 1.3;
    }
    .slide-ex-options {
      display: grid;
      gap: 10px;
    }
    .slide-ex-opt {
      text-align: left;
      padding: 13px 16px;
      border-radius: 10px;
      border: 1.5px solid var(--sl-border);
      background: var(--sl-panel);
      color: var(--sl-text);
      cursor: pointer;
      font-size: 20px;
      line-height: 1.35;
      transition: border-color 0.15s, background 0.15s;
    }
    .slide-ex-opt:hover:not(:disabled) {
      border-color: var(--sl-accent);
    }
    .slide-ex-opt.selected {
      border-color: var(--sl-accent);
      background: rgba(245, 158, 11, 0.16);
    }
    .slide-ex-opt.correct {
      border-color: var(--sl-ok);
      background: var(--sl-ok-bg);
    }
    .slide-ex-opt.wrong {
      border-color: var(--sl-bad);
      background: var(--sl-bad-bg);
    }
    .slide-match-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .slide-match-col {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .slide-ex-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: var(--sl-accent);
      color: var(--sl-accent-text);
      font-weight: 800;
      font-size: 18px;
      cursor: pointer;
    }
    .slide-gap-row {
      margin-bottom: 12px;
      font-size: 21px;
      line-height: 1.5;
    }
    .slide-ex-input {
      width: 180px;
      padding: 5px 10px;
      border-radius: 7px;
      border: 1.5px solid var(--sl-accent);
      background: var(--sl-panel);
      color: var(--sl-text);
      font-family: monospace;
      font-size: 20px;
    }
    .slide-ex-input.correct { border-color: var(--sl-ok); background: var(--sl-ok-bg); }
    .slide-ex-input.wrong { border-color: var(--sl-bad); background: var(--sl-bad-bg); }
    .slide-ex-fb { margin-top: 12px; font-size: 19px; font-weight: 600; }
    .fb-ok { color: var(--sl-ok); }
    .fb-bad { color: var(--sl-bad); }

    .reveal table { margin: 0.45em auto; font-size: 0.74em; border-collapse: collapse; width: 92%; max-width: 1160px; }
    .reveal table th { background: var(--sl-table-th); color: var(--sl-accent); border: 1px solid var(--sl-border); padding: 0.45em 0.8em; }
    .reveal table td { border: 1px solid var(--sl-border); padding: 0.4em 0.8em; color: var(--sl-text); }
    .reveal pre { width: 94%; font-size: 0.62em; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); border-radius: 10px; }

    .hint-keys { color: var(--sl-muted); font-size: 0.75rem; white-space: nowrap; }

    /* Mobile Optimization & Hamburger Drawer */
    @media (max-width: 768px) {
      .slides-topbar {
        padding: 0.35rem 0.55rem;
        gap: 0.4rem;
        min-height: 52px;
        flex-wrap: nowrap;
      }
      .topbar-left {
        flex: 1;
        min-width: 0;
        flex-wrap: nowrap;
        gap: 0.35rem;
      }
      .topic-select {
        flex: 1;
        min-width: 0;
        max-width: none;
        font-size: 0.8rem;
        padding: 0.42rem 0.45rem;
        min-height: 40px;
      }
      .hamburger-btn {
        display: inline-flex;
        flex-shrink: 0;
      }
      .topbar-drawer {
        display: none;
        position: fixed;
        top: 52px;
        left: 0;
        right: 0;
        background: var(--sl-bar);
        border-bottom: 1px solid var(--sl-border);
        padding: 0.75rem;
        gap: 0.5rem;
        flex-wrap: wrap;
        z-index: 150;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
      }
      .topbar-drawer.open {
        display: flex;
      }
      .topbar-drawer .slide-jump-select {
        width: 100%;
        max-width: none;
      }
      .reveal-wrapper {
        top: 52px;
        height: calc(100dvh - 52px);
      }
      .hint-keys { display: none; }
      .topbar-btn { padding: 0.42rem 0.65rem; font-size: 0.82rem; min-height: 40px; }
      .float-nav-btn {
        padding: 0.62rem 1.25rem;
        font-size: 0.94rem;
        min-height: 48px;
      }
      .reveal .slide-number {
        bottom: 68px !important;
        right: 10px !important;
        font-size: 13px !important;
      }
      .reveal { font-size: 36px; }
      .slide-ex-card { padding: 16px; font-size: 24px; }
      .slide-ex-title { font-size: 26px; }
      .slide-ex-opt { padding: 16px 18px; font-size: 23px; min-height: 54px; }
      .slide-match-grid { grid-template-columns: 1fr; }
      .slide-ex-input { width: 100%; font-size: 22px; margin: 6px 0; }
      .slide-ex-btn { min-height: 46px; padding: 10px 18px; font-size: 21px; }
    }

    /* Clean Slides PDF Export */
    @media print {
      html, body {
        height: auto !important;
        overflow: visible !important;
        background: #ffffff !important;
        color: #0f172a !important;
      }
      .slides-topbar,
      .topbar-drawer,
      .slide-float-nav,
      .reveal .controls,
      .reveal .progress,
      .reveal .slide-number,
      .reveal-ans-btn {
        display: none !important;
      }
      .reveal-wrapper {
        position: static !important;
        height: auto !important;
        background: #ffffff !important;
      }
      .reveal,
      .reveal .slides {
        position: static !important;
        width: 100% !important;
        height: auto !important;
        transform: none !important;
        font-size: 15pt !important;
        color: #0f172a !important;
      }
      .reveal .slides section {
        position: static !important;
        display: block !important;
        opacity: 1 !important;
        visibility: visible !important;
        transform: none !important;
        width: 100% !important;
        height: auto !important;
        margin: 0 0 18pt 0 !important;
        padding: 14pt 16pt !important;
        border: 1px solid #cbd5e1 !important;
        border-radius: 8pt !important;
        background: #ffffff !important;
        color: #0f172a !important;
        page-break-after: always;
        break-after: page;
        break-inside: avoid;
      }
      .reveal .slides section .fragment {
        opacity: 1 !important;
        visibility: visible !important;
        transform: none !important;
      }
      .reveal h1, .reveal h2, .reveal h3 { color: #b45309 !important; }
      .reveal p, .reveal li, .reveal td, .reveal th { color: #0f172a !important; }
      .slide-ans-box { display: block !important; }
    }
  </style>
</head>
<body>
  <div class="slides-topbar">
    <div class="topbar-left">
      <a href="index.html" class="topbar-btn" id="btn-home">← Kurs</a>
      <select class="topic-select" id="slide-topic-select" aria-label="Select topic"></select>
      <button type="button" class="topbar-btn hamburger-btn" id="btn-hamburger" aria-label="Menu" aria-expanded="false">☰</button>
    </div>
    <div class="topbar-drawer" id="topbar-drawer">
      <select class="topic-select slide-jump-select" id="slide-jump-select" aria-label="Jump to slide"></select>
      <a href="topic.html?id=1" class="topbar-btn" id="btn-notes">📖 Ma'ruza</a>
      <a href="labs.html?id=1" class="topbar-btn" id="btn-lab">🧪 L1</a>
      <span class="hint-keys" title="Shift + ←/→ skip fragments">Shift+←/→ · Esc/O</span>
      <button type="button" class="topbar-btn" id="btn-fragments" title="Toggle step-by-step fragments">⚡ Animatsiya: ON</button>
      <button type="button" class="topbar-btn" id="btn-overview" title="Overview Grid (Esc / O)">⊞ Overview</button>
      <button type="button" class="topbar-btn" id="btn-pdf" title="Slaydni PDF yuklab olish">📄 PDF</button>
      <button type="button" class="topbar-btn" id="btn-theme" title="Light / Dark Theme">☀️</button>
      <button type="button" class="topbar-btn" id="btn-fullscreen" title="Fullscreen (F)">⛶</button>
      <button type="button" class="topbar-btn" id="btn-uz">O'Z</button>
      <button type="button" class="topbar-btn" id="btn-en">EN</button>
    </div>
  </div>

  <div class="reveal-wrapper">
    <div class="reveal">
      <div class="slides" id="reveal-slides-container"></div>
    </div>
  </div>

  <div class="slide-float-nav" aria-label="Slide Navigation">
    <button type="button" class="float-nav-btn" id="float-prev">⬅ Oldingi</button>
    <button type="button" class="float-nav-btn" id="float-next">Keyingi ➡</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/slide-widgets.js"></script>
  <script src="js/quiz-engine.js"></script>
  <script src="js/data-topics-1.js"></script>
  <script src="js/data-topics-2.js"></script>
  <script src="js/data-topics-3.js"></script>
  <script src="js/data-topics-4.js"></script>
  <script src="js/data-topics-5.js"></script>
  <script src="js/data-topics-bonus.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
  <script>
    (function () {
      const STORAGE_FRAG = 'dm_slides_fragments';
      const topics = window.DM_TOPICS;
      const params = new URLSearchParams(window.location.search);
      let currentId = Math.min(topics.length, Math.max(1, Number(params.get('topic')) || 1));
      let deck = null;

      function getFragmentsEnabled() {
        try { return localStorage.getItem(STORAGE_FRAG) !== 'off'; } catch (e) { return true; }
      }
      function setFragmentsEnabled(on) {
        try { localStorage.setItem(STORAGE_FRAG, on ? 'on' : 'off'); } catch (e) { /* ignore */ }
      }

      function syncThemeUI() {
        const theme = window.DM_APP.getTheme();
        document.documentElement.setAttribute('data-theme', theme);
        const btn = document.getElementById('btn-theme');
        if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
      }

      function syncFragmentsUI() {
        const on = getFragmentsEnabled();
        const lang = window.DM_APP.getLang();
        document.body.classList.toggle('no-fragments', !on);
        const btn = document.getElementById('btn-fragments');
        if (btn) {
          btn.textContent = lang === 'uz'
            ? `⚡ Animatsiya: ${on ? 'ON' : 'OFF'}`
            : `⚡ Animation: ${on ? 'ON' : 'OFF'}`;
          btn.classList.toggle('active', on);
          btn.classList.toggle('off-state', !on);
        }
        if (deck) {
          deck.configure({ fragments: on });
        }
      }

      function escapeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function renderMath(el) {
        if (window.renderMathInElement) {
          window.renderMathInElement(el, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false }
            ],
            throwOnError: false
          });
        }
      }

      function populateJumpMenu(slideTitles, activeIdx) {
        const jumpSel = document.getElementById('slide-jump-select');
        if (!jumpSel) return;
        jumpSel.innerHTML = slideTitles.map((ttl, i) => `
          <option value="${i}" ${i === activeIdx ? 'selected' : ''}>${i + 1}. ${ttl}</option>
        `).join('');
      }

      function renderDeck() {
        syncThemeUI();
        const lang = window.DM_APP.getLang();
        const topic = topics.find((t) => t.id === currentId) || topics[0];
        const tag = topic.code || (topic.isBonus ? `B${topic.id - 15}` : `M${topic.id}`);

        document.title = `${tag}. ${topic.title[lang]} — Slides (Reveal.js)`;
        document.getElementById('btn-home').textContent = lang === 'uz' ? '← Kurs' : '← Home';
        document.getElementById('btn-notes').href = `topic.html?id=${topic.id}`;
        document.getElementById('btn-notes').textContent = lang === 'uz' ? '📖 Ma\'ruza' : '📖 Lecture';
        document.getElementById('btn-lab').href = topic.isBonus ? `topic.html?id=${topic.id}` : `labs.html?id=${topic.id}`;
        document.getElementById('btn-lab').style.display = topic.isBonus ? 'none' : 'inline-block';
        document.getElementById('btn-lab').textContent = `🧪 L${topic.id}`;
        document.getElementById('btn-uz').classList.toggle('active', lang === 'uz');
        document.getElementById('btn-en').classList.toggle('active', lang === 'en');
        const fp = document.getElementById('float-prev');
        const fn = document.getElementById('float-next');
        if (fp) fp.textContent = lang === 'uz' ? '⬅ Oldingi' : '⬅ Prev';
        if (fn) fn.textContent = lang === 'uz' ? 'Keyingi ➡' : 'Next ➡';
        const bp = document.getElementById('btn-pdf');
        if (bp) bp.textContent = lang === 'uz' ? '📄 PDF yuklab olish' : '📄 Download PDF';

        const sel = document.getElementById('slide-topic-select');
        sel.innerHTML = topics.map((tp) => {
          const tTag = tp.code || (tp.isBonus ? `B${tp.id - 15}` : `M${tp.id}`);
          return `<option value="${tp.id}" ${tp.id === currentId ? 'selected' : ''}>${tTag}. ${tp.title[lang]}</option>`;
        }).join('');

        const container = document.getElementById('reveal-slides-container');
        let html = '';
        const slideTitles = [];
        const slideExercises = [];

        topic.slides.forEach((sl, idx) => {
          slideTitles.push(sl.title[lang]);
          html += `<section>`;
          if (idx === 0) {
            html += `<p style="font-size:0.62em; color:var(--sl-muted); letter-spacing:0.08em; text-transform:uppercase;">MITQ2506 · TAN TEXTBOOK · ${tag} (80 MIN)</p>`;
            html += `<h1>${sl.title[lang]}</h1>`;
          } else {
            html += `<h2>${sl.title[lang]}</h2>`;
          }
          if (sl.subtitle) html += `<div class="slide-subtitle">${sl.subtitle[lang]}</div>`;
          if (sl.latex) html += `<div class="slide-formula">$$${sl.latex}$$</div>`;
          else if (sl.formula) html += `<div class="slide-formula">${escapeHtml(sl.formula)}</div>`;
          if (sl.points && sl.points[lang]) {
            html += `<ul>${sl.points[lang].map((pt) => `<li class="fragment fade-in">${pt}</li>`).join('')}</ul>`;
          }
          if (sl.table) {
            html += `<table><thead><tr>${sl.table.headers[lang].map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${sl.table.rows[lang].map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
          }
          if (sl.code) html += `<pre><code class="language-python" data-trim>${escapeHtml(sl.code)}</code></pre>`;
          if (sl.widget) html += `<div class="slide-widget-slot" data-widget="${sl.widget}" data-prevent-swipe></div>`;
          if (sl.discussion) {
            html += `<div class="slide-discussion">
              <div><strong>💬 ${lang === 'uz' ? 'Talabalarga savol:' : 'Class Discussion:'}</strong> ${sl.discussion.q[lang]}</div>
              <button type="button" class="reveal-ans-btn">${lang === 'uz' ? 'Javobni ko\'rsatish' : 'Reveal Answer'}</button>
              <div class="slide-ans-box">${sl.discussion.a[lang]}</div>
            </div>`;
          }
          if (sl.note) html += `<div class="slide-note">${sl.note[lang]}</div>`;
          if (sl.speakerNote) html += `<aside class="notes">${sl.speakerNote[lang]}</aside>`;
          html += `</section>`;
        });

        if (topic.quiz && topic.quiz.length) {
          const exIdx = slideExercises.length;
          slideExercises.push({ type: 'mcq', ...topic.quiz[0] });
          const ttl = lang === 'uz' ? 'Interaktiv Tekshiruv (Quiz)' : 'Quick Check (Quiz)';
          slideTitles.push(ttl);
          html += `<section><h2>📝 ${ttl}</h2><div class="slide-exercise-slot" data-ex-idx="${exIdx}" data-prevent-swipe></div></section>`;
        }

        if (topic.matching && topic.matching.length) {
          const exIdx = slideExercises.length;
          slideExercises.push({ type: 'matching', pairs: topic.matching });
          const ttl = lang === 'uz' ? 'Moslashtirish Mashqi' : 'Matching Exercise';
          slideTitles.push(ttl);
          html += `<section><h2>🔗 ${ttl}</h2><div class="slide-exercise-slot" data-ex-idx="${exIdx}" data-prevent-swipe></div></section>`;
        }

        if (topic.fillGap && topic.fillGap.length) {
          const exIdx = slideExercises.length;
          slideExercises.push({ type: 'fillGap', items: topic.fillGap });
          const ttl = lang === 'uz' ? 'Bo\'shliqni To\'ldiring' : 'Fill in the Gap';
          slideTitles.push(ttl);
          html += `<section><h2>✍️ ${ttl}</h2><div class="slide-exercise-slot" data-ex-idx="${exIdx}" data-prevent-swipe></div></section>`;
        }

        if (topic.glossary && topic.glossary.length) {
          const ttl = lang === 'uz' ? 'Asosiy Atamalar' : 'Key Terminology';
          slideTitles.push(ttl);
          html += `<section>
            <h2>📖 ${ttl}</h2>
            <table>
              <thead><tr><th>O'zbekcha</th><th>English</th><th>${lang === 'uz' ? 'Ta\'rif' : 'Definition'}</th></tr></thead>
              <tbody>${topic.glossary.map((g) => `<tr><td><strong>${g.uz}</strong></td><td>${g.en}</td><td>${lang === 'uz' ? g.defUz : g.defEn}</td></tr>`).join('')}</tbody>
            </table>
          </section>`;
        }

        if (topic.lab && topic.lab.steps) {
          topic.lab.steps.forEach((st, i) => {
            const ttl = `${lang === 'uz' ? `Lab ${i + 1}-qadam` : `Lab Step ${i + 1}`}: ${st.title[lang]}`;
            slideTitles.push(ttl);
            html += `<section>
              <h2>💻 ${ttl}</h2>
              <p style="font-size:0.78em; color:var(--sl-muted);">${st.desc[lang]}</p>
              <pre><code class="language-python" data-trim>${escapeHtml(st.code)}</code></pre>
            </section>`;
          });
        }

        const nextTopic = topics.find((t) => t.id === topic.id + 1);
        const endTtl = lang === 'uz' ? 'Dars Xulosasi' : 'Summary';
        slideTitles.push(endTtl);
        html += `<section>
          <h2>🎯 ${lang === 'uz' ? 'Dars xulosasi va Vazifalar' : 'Summary & Assignments'}</h2>
          <ul>
            <li>📝 <a href="topic.html?id=${topic.id}#topic-quiz">${lang === 'uz' ? `${tag} bo'yicha barcha test, moslashtirish va bo'shliq mashqlarini yeching` : `Complete all Quiz, Matching & Fill-Gap exercises`}</a></li>
            ${!topic.isBonus ? `<li>🧪 <a href="labs.html?id=${topic.id}">${lang === 'uz' ? `L${topic.id} Laboratoriya ishini bajaring` : `Complete Lab L${topic.id}`}</a></li>` : ''}
            ${nextTopic ? `<li>➡️ <a href="slides.html?topic=${nextTopic.id}">${lang === 'uz' ? 'Keyingi mavzu' : 'Next Deck'}: ${nextTopic.code || 'B' + (nextTopic.id - 15)}. ${nextTopic.title[lang]}</a></li>` : ''}
          </ul>
        </section>`;

        container.innerHTML = html;
        populateJumpMenu(slideTitles, 0);

        container.querySelectorAll('[data-widget]').forEach((slot) => {
          if (window.DM_WIDGETS) window.DM_WIDGETS.renderWidget(slot, slot.getAttribute('data-widget'));
        });
        container.querySelectorAll('[data-ex-idx]').forEach((slot) => {
          const ex = slideExercises[Number(slot.getAttribute('data-ex-idx'))];
          if (window.DM_QUIZ) window.DM_QUIZ.renderSlideExercise(slot, ex);
          const stopEx = (e) => {
            if (e.target && e.target.closest('button, input, label, select')) e.stopPropagation();
          };
          slot.addEventListener('touchstart', stopEx, { passive: true });
          slot.addEventListener('touchmove', stopEx, { passive: true });
          slot.addEventListener('pointerdown', stopEx, { passive: true });
        });
        container.querySelectorAll('.reveal-ans-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            const box = btn.nextElementSibling;
            if (box) box.classList.toggle('open');
          });
        });

        renderMath(container);

        function getSlideDims() {
          const portraitMobile = window.innerWidth <= 768 && window.innerHeight > window.innerWidth;
          return portraitMobile
            ? { width: 760, height: 1120, margin: 0.04 }
            : { width: 1400, height: 850, margin: 0.04 };
        }

        const dims = getSlideDims();
        const fragOn = getFragmentsEnabled();
        if (!deck) {
          deck = new Reveal({
            width: dims.width,
            height: dims.height,
            margin: dims.margin,
            minScale: 0.2,
            maxScale: 1.5,
            controls: true,
            touch: true,
            embedded: false,
            overview: true,
            fragments: fragOn,
            hash: false,
            slideNumber: 'c/t',
            transition: 'slide',
            plugins: [RevealHighlight, RevealNotes]
          });
          deck.initialize().then(() => {
            syncFragmentsUI();
            deck.on('slidechanged', (ev) => {
              const jumpSel = document.getElementById('slide-jump-select');
              if (jumpSel && typeof ev.indexh === 'number') jumpSel.value = String(ev.indexh);
            });
          });
        } else {
          deck.configure({ fragments: fragOn, width: dims.width, height: dims.height, margin: dims.margin });
          deck.sync();
          deck.layout();
          deck.slide(0);
          syncFragmentsUI();
          if (window.hljs) {
            container.querySelectorAll('pre code').forEach((el) => {
              delete el.dataset.highlighted;
              window.hljs.highlightElement(el);
            });
          }
        }
      }

      function closeDrawer() {
        const dr = document.getElementById('topbar-drawer');
        const hb = document.getElementById('btn-hamburger');
        if (dr) dr.classList.remove('open');
        if (hb) hb.setAttribute('aria-expanded', 'false');
      }

      window.addEventListener('resize', () => {
        if (!deck) return;
        const portraitMobile = window.innerWidth <= 768 && window.innerHeight > window.innerWidth;
        deck.configure(portraitMobile ? { width: 760, height: 1120, margin: 0.04 } : { width: 1400, height: 850, margin: 0.04 });
        deck.layout();
      });

      const hbBtn = document.getElementById('btn-hamburger');
      if (hbBtn) {
        hbBtn.addEventListener('click', () => {
          const dr = document.getElementById('topbar-drawer');
          if (!dr) return;
          const open = dr.classList.toggle('open');
          hbBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
      }

      document.getElementById('float-prev').addEventListener('click', () => { closeDrawer(); if (deck) deck.prev(); });
      document.getElementById('float-next').addEventListener('click', () => { closeDrawer(); if (deck) deck.next(); });

      document.getElementById('btn-pdf').addEventListener('click', () => {
        closeDrawer();
        window.print();
      });

      // Shift + Left / Right bypasses fragments and jumps directly to prev/next slide
      document.addEventListener('keydown', (e) => {
        if (!deck || !e.shiftKey) return;
        const tag = (document.activeElement && document.activeElement.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        if (e.key === 'ArrowRight') {
          e.preventDefault();
          e.stopPropagation();
          const idx = deck.getIndices();
          deck.slide(idx.h + 1, 0);
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          e.stopPropagation();
          const idx = deck.getIndices();
          deck.slide(Math.max(0, idx.h - 1), 0);
        }
      }, true);

      document.getElementById('slide-topic-select').addEventListener('change', (e) => {
        closeDrawer();
        currentId = Number(e.target.value);
        const url = new URL(window.location.href);
        url.searchParams.set('topic', currentId);
        window.history.replaceState({}, '', url.toString());
        renderDeck();
      });

      document.getElementById('slide-jump-select').addEventListener('change', (e) => {
        closeDrawer();
        if (deck) deck.slide(Number(e.target.value), 0);
      });

      document.getElementById('btn-fragments').addEventListener('click', () => {
        setFragmentsEnabled(!getFragmentsEnabled());
        syncFragmentsUI();
      });

      document.getElementById('btn-overview').addEventListener('click', () => {
        closeDrawer();
        if (deck) deck.toggleOverview();
      });

      document.getElementById('btn-theme').addEventListener('click', () => {
        window.DM_APP.toggleTheme();
        syncThemeUI();
      });

      document.getElementById('btn-fullscreen').addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });

      document.getElementById('btn-uz').addEventListener('click', () => { window.DM_APP.setLang('uz'); renderDeck(); });
      document.getElementById('btn-en').addEventListener('click', () => { window.DM_APP.setLang('en'); renderDeck(); });

      renderDeck();
    })();
  </script>
</body>
</html>
